name: Deploy Backend → ECR + EC2

on:
  push:
    branches: [claude/serene-euler-Gq1ma]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push to ECR, deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$ECR_REGISTRY/trading-strategy-backend
          docker build -t $IMAGE:$IMAGE_TAG -t $IMAGE:latest .
          docker push $IMAGE:$IMAGE_TAG
          docker push $IMAGE:latest
          echo "FULL_IMAGE=$IMAGE:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FULL_IMAGE
          script: |
            # Log in to ECR from the instance (uses the attached IAM role)
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker pull $FULL_IMAGE

            docker stop trading-backend 2>/dev/null || true
            docker rm   trading-backend 2>/dev/null || true

            docker run -d \
              --name trading-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              -e CORS_ORIGINS="${{ secrets.FRONTEND_URL }}" \
              -e STORE_ROOT=/data/trading-strategies \
              -v /mnt/strategy-data:/data \
              $FULL_IMAGE

            # Quick health check
            sleep 5
            curl -sf http://localhost:8000/docs > /dev/null && echo "Health check passed" || echo "WARNING: health check failed"
