name: Deploy → Dev (Fly.io)

on:
  push:
    branches: [deployment]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'fly.dev.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: fly deploy --config fly.dev.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
