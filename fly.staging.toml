app = "trading-strategy-backend-stg"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  STORE_ROOT = "/data/trading-strategies"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "strategy_data"
  destination = "/data/trading-strategies"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
